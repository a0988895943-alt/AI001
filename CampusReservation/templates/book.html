<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空間與資源預約</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">🎓 校園資源預約系統</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">儀表板</a></li>
                <li class="nav-item"><a class="nav-link active" href="/book">空間預約</a></li>
                <li class="nav-item"><a class="nav-link" href="#">設備借用</a></li>
                <li class="nav-item"><a class="nav-link" href="#">我的預約</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 pt-4 pb-0">
                    <h4 class="fw-bold">新增預約</h4>
                </div>
                <div class="card-body">
                    <div id="alertContainer"></div>
                    <form id="bookingForm">
                        <div class="mb-3">
                            <label class="form-label">選擇空間</label>
                            <select class="form-select" id="roomId" required>
                                <option value="" selected disabled>請選擇欲借用的空間</option>
                                {% for r in rooms %}
                                <option value="{{ r.id }}">{{ r.name }} (容納 {{ r.capacity }} 人)</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">附加設備 (選填)</label>
                            <select class="form-select" id="equipmentId">
                                <option value="">無</option>
                                {% for e in equipments %}
                                <option value="{{ e.id }}">{{ e.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">日期</label>
                                <input type="date" class="form-control" id="bookDate" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">開始時間</label>
                                <input type="time" class="form-control" id="startTime" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">結束時間</label>
                                <input type="time" class="form-control" id="endTime" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-3" id="submitBtn">送出預約申請</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('bookingForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = '處理中...';
    
    const data = {
        room_id: document.getElementById('roomId').value,
        equipment_id: document.getElementById('equipmentId').value,
        date: document.getElementById('bookDate').value,
        start_time: document.getElementById('startTime').value,
        end_time: document.getElementById('endTime').value
    };

    try {
        const response = await fetch('/api/book', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        const alertContainer = document.getElementById('alertContainer');
        
        if (response.ok) {
            alertContainer.innerHTML = `<div class="alert alert-success">${result.message}</div>`;
            setTimeout(() => { window.location.href = '/'; }, 1500);
        } else {
            alertContainer.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
        }
    } catch (error) {
        document.getElementById('alertContainer').innerHTML = `<div class="alert alert-danger">系統發生錯誤，請稍後再試。</div>`;
    } finally {
        btn.disabled = false;
        btn.innerText = '送出預約申請';
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
