<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 校園空間預約系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f8f9fa; }
        .login-card { width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; }
    </style>
</head>
<body>

<div class="card shadow-sm border-0 login-card bg-white">
    <div class="card-body">
        <div class="text-center mb-4">
            <h3 class="fw-bold">🎓 資源預約系統</h3>
            <p class="text-muted">請登入您的帳號</p>
        </div>
        
        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label">Email 信箱</label>
                <input type="email" class="form-control" name="email" required placeholder="admin@school.edu 或 student@school.edu">
            </div>
            <div class="mb-4">
                <label class="form-label">密碼</label>
                <input type="password" class="form-control" name="password" required placeholder="1234">
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">登入系統</button>
        </form>
        
        <div class="mt-4 text-muted small text-center">
            <p class="mb-1">測試帳號：</p>
            <p class="mb-0">Admin: admin@school.edu / 1234</p>
            <p class="mb-0">Student: student@school.edu / 1234</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
